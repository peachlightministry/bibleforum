<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible Forum</title>
<meta name="description" content="Parables of the Bible, their common interpretation, and how the saints lived them.">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #fdfcf9;
    --ink: #1d1b18;
    --muted: #6d675d;
    --line: #dcd7cb;
    --accent: #7a1f2b;

    --font-serif: Georgia, "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --space-1: 8px;
    --space-2: 16px;
    --space-3: 24px;
    --space-4: 48px;
    --space-5: 96px;
    --radius: 2px;
    --icon: 20px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: min(720px, 100% - 2 * var(--space-2));
    margin-inline: auto;
  }

  header { padding: var(--space-5) 0 var(--space-4); }

  .eyebrow {
    margin: 0 0 var(--space-2);
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0;
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: clamp(2.25rem, 6vw, 3.5rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  .lede {
    margin: var(--space-2) 0 0;
    max-width: 46ch;
    color: var(--muted);
    font-size: 1.0625rem;
  }

  main { padding-bottom: var(--space-5); }

  .list { border-top: 1px solid var(--line); }

  .item { border-bottom: 1px solid var(--line); }

  .trigger {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    width: 100%;
    padding: var(--space-2) var(--space-1);
    background: none;
    border: 0;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
  }

  .trigger:hover { background: rgba(122, 31, 43, 0.04); }
  .trigger:hover .title { color: var(--accent); }
  .trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .num {
    flex: none;
    width: 1.5rem;
    font-family: var(--font-serif);
    font-size: 0.9375rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .title {
    flex: 1;
    font-family: var(--font-serif);
    font-size: 1.1875rem;
    transition: color 0.2s;
  }

  .chevron {
    flex: none;
    width: var(--icon);
    height: var(--icon);
    color: var(--muted);
    transition: transform 0.25s ease, color 0.2s;
  }

  .trigger[aria-expanded="true"] .chevron { transform: rotate(180deg); color: var(--accent); }

  .panel {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.28s ease;
  }
  .panel[data-open="true"] { grid-template-rows: 1fr; }
  .panel > div { overflow: hidden; }

  .panel p {
    margin: 0;
    padding: 0 var(--space-1) var(--space-3) calc(var(--space-1) + 1.5rem + var(--space-2));
    color: var(--muted);
  }

  footer {
    padding: var(--space-3) 0 var(--space-4);
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.8125rem;
  }

  @media (max-width: 520px) {
    header { padding: var(--space-4) 0 var(--space-3); }
    main { padding-bottom: var(--space-4); }
    .title { font-size: 1.0625rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .panel, .chevron, .trigger, .title { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Bible Forum</p>
      <h1>The Parables</h1>
      <p class="lede">Each parable, its most common interpretation, and how the saints and desert fathers lived it.</p>
    </header>

    <main>
      <div class="list" id="list">
        <!-- items rendered by script below -->
      </div>
    </main>

    <footer>&copy; Bible Forum</footer>
  </div>

<script>
  const items = [
    { title: "Placeholder", body: "placeholder" },
    { title: "Placeholder", body: "placeholder" },
    { title: "Placeholder", body: "placeholder" },
    { title: "Placeholder", body: "placeholder" },
    { title: "Placeholder", body: "placeholder" }
  ];

  const chevron =
    '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="m6 9 6 6 6-6"/></svg>';

  const list = document.getElementById("list");

  items.forEach((item, i) => {
    const el = document.createElement("section");
    el.className = "item";
    el.innerHTML =
      `<h2 style="margin:0;font:inherit">
         <button class="trigger" aria-expanded="false" aria-controls="p${i}" id="t${i}">
           <span class="num">${i + 1}</span>
           <span class="title">${item.title}</span>
           ${chevron}
         </button>
       </h2>
       <div class="panel" id="p${i}" role="region" aria-labelledby="t${i}" data-open="false">
         <div><p>${item.body}</p></div>
       </div>`;
    list.appendChild(el);
  });

  list.addEventListener("click", (e) => {
    const btn = e.target.closest(".trigger");
    if (!btn) return;
    const open = btn.getAttribute("aria-expanded") === "true";
    btn.setAttribute("aria-expanded", String(!open));
    document.getElementById(btn.getAttribute("aria-controls")).dataset.open = String(!open);
  });
</script>
</body>
</html>
